<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdventureForge</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap"
    rel="stylesheet">
  <!-- React Flow styles -->
  <link rel="stylesheet" href="https://esm.sh/reactflow@11.11.4/dist/style.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      overflow: hidden;
    }

    /* Adjusted to prevent interference with custom node styling */
    .react-flow__node {
      border-radius: 12px;
      padding: 0;
    }

    .react-flow__handle {
      width: 10px !important;
      height: 10px !important;
      background: #3b82f6 !important;
      border: 2px solid #fff !important;
    }

    .react-flow__edge-path {
      stroke-width: 3 !important;
      stroke: #475569 !important;
    }

    .react-flow__controls-button {
      background: #1e293b !important;
      fill: #f8fafc !important;
      border-bottom: 1px solid #334155 !important;
    }

    .react-flow__minimap {
      background: #1e293b !important;
      border-radius: 8px;
    }

    /* Selection box styling */
    .react-flow__selection {
      background: rgba(59, 130, 246, 0.1);
      border: 1px dashed #3b82f6;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "reactflow/": "https://esm.sh/reactflow@^11.11.4/",
    "reactflow": "https://esm.sh/reactflow@^11.11.4"
  }
}
</script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
